<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3FA4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7928CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3FA4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9B95F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0070F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#08070B" />
  <rect width="500" height="500" x="6" y="6" rx="124" fill="none" stroke="url(#grad1)" stroke-width="8" opacity="0.6" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#grad1)" stroke-width="4" opacity="0.4" />
  
  <!-- Cardinal Points -->
  <text x="256" y="96" fill="#FF3FA4" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">N</text>
  <text x="424" y="266" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-weight="700" font-size="24" text-anchor="middle">E</text>
  <text x="256" y="434" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-weight="700" font-size="24" text-anchor="middle">S</text>
  <text x="88" y="266" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-weight="700" font-size="24" text-anchor="middle">W</text>
  
  <!-- Compass Needle (North) -->
  <polygon points="256,120 286,256 256,240 226,256" fill="url(#needleRed)" />
  <!-- Compass Needle (South) -->
  <polygon points="256,392 286,256 256,272 226,256" fill="url(#needleBlue)" />
  
  <!-- Pivot -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="8" fill="#08070B" />
</svg>
